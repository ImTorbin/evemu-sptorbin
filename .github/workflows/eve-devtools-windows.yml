name: eve-devtools / Windows build

on:
  push:
    tags:
      - 'devtools-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: tools/eve-devtools

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/eve-devtools/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/eve-devtools/src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri bundle
        env:
          # Reproducible + non-interactive builds.
          TAURI_SKIP_UPDATE_CHECK: 1
        run: npm run tauri -- build

      - name: Collect installers
        run: |
          New-Item -ItemType Directory -Force -Path dist-installers | Out-Null
          $bundleRoot = "src-tauri/target/release/bundle"
          Get-ChildItem -Recurse "$bundleRoot" -Include *.msi,*.exe |
              ForEach-Object { Copy-Item $_.FullName "dist-installers/" }
          Get-ChildItem dist-installers

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eve-devtools-windows
          path: tools/eve-devtools/dist-installers/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/devtools-v')
        uses: softprops/action-gh-release@v2
        with:
          files: tools/eve-devtools/dist-installers/*
          draft: false
          prerelease: false
          generate_release_notes: true
